<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Dhub Education" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#a63391" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#a63391" media="(prefers-color-scheme: dark)">
    <!-- Site-wide identity. The host here must match the canonical URLs emitted
         by $lib/seo (non-www), otherwise ranking signals split across two hosts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://dhubeducation.com/#website",
            "name": "Dhub Education",
            "url": "https://dhubeducation.com",
            "inLanguage": "en-GB",
            "publisher": { "@id": "https://dhubeducation.com/#organization" }
          },
          {
            "@type": "EducationalOrganization",
            "@id": "https://dhubeducation.com/#organization",
            "name": "Dhub Education",
            "url": "https://dhubeducation.com",
            "description": "Study abroad consultancy helping Nigerian students and parents secure verified university admissions and student visas.",
            "areaServed": { "@type": "Country", "name": "Nigeria" },
            "knowsAbout": [
              "study abroad",
              "international student admissions",
              "UK student visas",
              "university applications"
            ]
          }
        ]
      }
    </script>
  </head>
  <body data-sveltekit-preload-data="hover" data-sveltekit-reload>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
